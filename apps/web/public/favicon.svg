<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  <rect width="98" height="98" x="1" y="1" rx="23" stroke="#27272a" stroke-width="1.5" />

  <!-- Form Stack Layer 1 (Leftmost card) -->
  <rect x="22" y="36" width="16" height="34" rx="4" transform="rotate(-15 22 36)" fill="url(#cardGrad)" opacity="0.4" />
  
  <!-- Form Stack Layer 2 (Middle card) -->
  <rect x="30" y="30" width="17" height="38" rx="4" transform="rotate(-8 30 30)" fill="url(#cardGrad)" opacity="0.75" />

  <!-- Main "F" Stem & Top Arm -->
  <path
    d="M44 26 C44 23.8 45.8 22 48 22 L74 22 C76.2 22 78 23.8 77.2 26.2 L73.5 37 C73 38.5 71.5 39.5 70 39.5 L55 39.5 L55 46 L68 46 C70.2 46 71.8 47.8 71 50 L68 58 C67.5 59.5 66 60.5 64.5 60.5 L53 60.5 L47 79 C46.4 80.8 44.5 82 42.5 82 L38 82 C35.8 82 34.2 80 34.8 78 L44 48 Z"
    fill="url(#primaryGrad)"
    filter="url(#glow)"
  />

  <!-- Lightning / Spark Cutout Accent -->
  <path
    d="M57 38 L48 51 L55 51 L51 63 L65 48 L58 48 Z"
    fill="url(#sparkGrad)"
  />
</svg>
